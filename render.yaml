services:
  - type: worker
    name: gigachat-telegram-bot
    runtime: python
    buildCommand: pip install -r bot/requirements.txt
    startCommand: python bot/telegram_bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GIGACHAT_CREDENTIALS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
